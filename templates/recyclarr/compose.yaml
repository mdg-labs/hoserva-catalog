# Written from https://recyclarr.dev/guide/installation/docker/, https://recyclarr.dev/guide/getting-started/ and https://recyclarr.dev/reference/configuration/value-substitution/ (D19).
# Icon: https://github.com/selfhst/icons/blob/main/svg/recyclarr.svg, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none
#
# Recyclarr has no web interface. It runs in cron mode: the container stays up
# and syncs Sonarr and Radarr on the sync schedule. The image reads no PUID or
# PGID; the documentation sets the user instead, so it runs as 99:100, the
# owner of the appdata folder.
#
# Nothing is synced until you write the configuration. RECYCLARR_CREATE_CONFIG
# makes Recyclarr create recyclarr.yml in its appdata folder on the first
# start; edit it, or create one from a template with
# docker exec <container> recyclarr config create --template <name>.
# Sonarr and Radarr run in their own stacks, so the URL inputs use the
# server's address. Use the inputs in the configuration instead of pasting
# the values:
#   base_url: !env_var SONARR_URL
#   api_key: !env_var SONARR_API_KEY
# and the same with RADARR_URL and RADARR_API_KEY for Radarr.
services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.3
    user: "99:100"
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: ${CRON_SCHEDULE}
      RECYCLARR_CREATE_CONFIG: "true"
      SONARR_URL: ${SONARR_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_URL: ${RADARR_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
    volumes:
      - ${APPDATA}/recyclarr:/config
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: recyclarr
  revision: 3
  title: Recyclarr
  categories: [media, automation]
  icon: icon.svg
  docs: https://recyclarr.dev/guide/installation/docker/
  description: |
    A command-line tool that keeps the quality profiles, custom formats and naming settings of Sonarr and Radarr in line with a configuration file, including the settings the TRaSH Guides recommend.

    It has no web interface and syncs on the schedule you set. Nothing is synced until you write the configuration: Recyclarr creates recyclarr.yml in the app's folder on the first start; edit it, or create one from a template with docker exec <container> recyclarr config create --template <name>. In it, refer to the address and API key inputs with !env_var SONARR_URL and !env_var SONARR_API_KEY, and the same with RADARR for Radarr.
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    CRON_SCHEDULE:
      kind: string
      default: "@daily"
      label: Sync schedule
      description: How often Recyclarr syncs, in cron syntax. @daily syncs once a day; 0 */6 * * * syncs every six hours.
    SONARR_URL:
      kind: string
      label: Sonarr address
      description: The address of Sonarr, for example http://192.168.1.10:8989. Leave it empty if you do not use Sonarr.
    SONARR_API_KEY:
      kind: string
      label: Sonarr API key
      description: Copy it from Sonarr, under Settings, General, API Key. Leave it empty if you do not use Sonarr.
    RADARR_URL:
      kind: string
      label: Radarr address
      description: The address of Radarr, for example http://192.168.1.10:7878. Leave it empty if you do not use Radarr.
    RADARR_API_KEY:
      kind: string
      label: Radarr API key
      description: Copy it from Radarr, under Settings, General, API Key. Leave it empty if you do not use Radarr.
    TZ: { kind: timezone }
