# Written from https://hub.docker.com/_/nextcloud (the image documentation, https://github.com/docker-library/docs/blob/master/nextcloud/README.md), https://github.com/nextcloud/docker/blob/master/.examples/docker-compose/insecure/postgres/apache/compose.yaml and https://docs.nextcloud.com/server/35/admin_manual/installation/system_requirements.html, https://docs.nextcloud.com/server/35/admin_manual/maintenance/upgrade.html and https://docs.nextcloud.com/server/35/admin_manual/release_notes/upgrade_to_35.html (D19).
# Icon: https://github.com/selfhst/icons/blob/main/svg/nextcloud.svg, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none
#
# The official apache image with PostgreSQL and Redis, as the image
# documentation describes: the database for the data, and Redis, which the
# documentation recommends to prevent file locking problems. The image
# documentation says the image is maintained by community volunteers and
# designed for expert use, and names Nextcloud All-in-One for the full
# feature set; its documented install mounts the Docker socket, which the
# privilege summary exists to flag, so it is not used here.
#
# The database and the Redis data are under the appdata folder, and so are the
# Nextcloud program and its config folder (/var/www/html). Only the data folder
# (/var/www/html/data, one of the additional volumes the image documentation
# lists) is on the pool. The image documents no PUID or PGID setting, and its
# own migration notes show the data folder owned by www-data.
#
# On the first visit Nextcloud asks for the administrator account; the database
# is already configured by the variables below. This plain HTTP port is meant
# for the local network or a reverse proxy; to serve it under another host
# name, add that name to NEXTCLOUD_TRUSTED_DOMAINS as the image documentation
# describes. No cron container is included; the examples folder the image
# documentation points to has one.
#
# PostgreSQL 18 is one of the versions the system requirements list as
# supported; the database mount is the one upstream's example uses for the
# current postgres image (postgres:alpine is 18-alpine).
#
# Updating from revision 1 (Nextcloud 34.0.4) to Nextcloud 35: the image
# upgrades the installation when it starts, and the upgrade page requires the
# latest point release of the current major version first, which 34.0.4 is
# (the image documentation lists no later 34.x). Nextcloud can only be upgraded
# one major version at a time and does not support downgrading, so make a backup
# of the appdata and data folders before applying this update. The 35 release
# notes list only system requirement changes (PHP 8.2, older operating system,
# MariaDB and MySQL versions dropped), none of which concern the image and
# PostgreSQL 18 used here.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${APPDATA}/nextcloud/db:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    volumes:
      - ${APPDATA}/nextcloud/redis:/data
    restart: unless-stopped
  app:
    image: nextcloud:35.0.1-apache
    depends_on:
      - db
      - redis
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    volumes:
      - ${APPDATA}/nextcloud/html:/var/www/html
      - ${DATA}:/var/www/html/data
    ports:
      - ${WEBUI_PORT}:80
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: nextcloud
  revision: 3
  title: Nextcloud
  categories: [files, productivity]
  icon: icon.svg
  docs: https://hub.docker.com/_/nextcloud
  webui: http://{host}:${WEBUI_PORT}
  description: |
    A self-hosted file sync and sharing platform: keep your files, calendars and contacts on your own server and reach them from the web, desktop and mobile apps.

    It is the official Nextcloud image with PostgreSQL and Redis in the same stack. On the first visit Nextcloud asks for the administrator account; the database is already set up. The web port is plain HTTP, meant for the local network or a reverse proxy; to open it under another host name, add that name to NEXTCLOUD_TRUSTED_DOMAINS as the image documentation describes. No background-jobs (cron) container is included.

    Nextcloud can only be upgraded one major version at a time and cannot be downgraded, so back up the app's folder and the data folder before applying an update.
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    DATA:
      kind: path
      role: share
      default: /mnt/user/nextcloud
      label: Data folder
      description: The folder that holds the files of every Nextcloud user. Only Nextcloud should change what is in it.
    DB_PASSWORD: { kind: secret, label: Database password }
    WEBUI_PORT:  { kind: port, default: 8080, label: Web UI port }
