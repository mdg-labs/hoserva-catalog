# Written from https://docs.linuxserver.io/images/docker-heimdall/ and https://github.com/linuxserver/Heimdall (D19).
# Icon: https://github.com/selfhst/icons/blob/main/svg/heimdall.svg, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none
#
# Heimdall serves the dashboard over both HTTP and HTTPS; the HTTPS address
# uses a certificate the image generates itself, so a browser warns about it.
#
# A fresh install asks for no login. Heimdall can require one: give the user a
# password on the Users page and turn off "Allow public access to front" there;
# the front page is then only shown to a logged-in user. The image
# documentation also describes optional password protection through htpasswd:
# run `htpasswd -c /config/nginx/.htpasswd <username>` in the app's container,
# then uncomment the `basic auth` lines in /config/nginx/site-confs/default.conf
# in the appdata folder and restart the app.
#
# By default Heimdall refuses lookup requests to private or reserved IP
# addresses. The image documentation says a server that is not exposed to the
# internet, or sits behind some authentication, can allow them with
# ALLOW_INTERNAL_REQUESTS=true; this template leaves it at the default.
services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:v2.8.3-ls365
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/heimdall:/config
    ports:
      - ${WEBUI_PORT}:80
      - ${HTTPS_PORT}:443
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: heimdall
  revision: 2
  title: Heimdall
  categories: [productivity]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-heimdall/
  webui: http://{host}:${WEBUI_PORT}
  description: |
    An application dashboard: a start page of tiles that link to your self-hosted apps and websites, with live status information for some of them.

    A fresh install asks for no login. To require one, give the user a password on the Users page and turn off Allow public access to front there. The HTTPS address uses a certificate the image generates itself, so a browser warns about it. The default ports 80 and 443 are also those of Nginx Proxy Manager and SWAG; change them to run these together.
  inputs:
    APPDATA:    { kind: path, role: appdata, default: /mnt/cache/appdata }
    WEBUI_PORT: { kind: port, default: 80, label: Web UI port (HTTP) }
    HTTPS_PORT: { kind: port, default: 443, label: Web UI port (HTTPS) }
    TZ:         { kind: timezone }
