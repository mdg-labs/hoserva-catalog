# Written from https://docs.linuxserver.io/images/docker-pyload-ng/ and https://github.com/pyload/pyload (D19).
# Icon: https://github.com/pyload/pyload/blob/develop/media/logo.svg, AGPL-3.0-or-later (LICENSE.md and README of that repository), none
#
# The web UI login is pyload with the password pyload until you change it: do
# that first in the web interface. Finished downloads are saved to /downloads,
# the folder chosen at install. The default sits in the data folder next to
# the torrent and usenet downloads of the media apps, so it is a plain
# download folder and not part of the media library.
#
# Click'n'Load, which lets a browser extension or a download page send links
# to pyLoad on port 9666, is optional in the image documentation and is not
# published here.
services:
  pyload-ng:
    image: lscr.io/linuxserver/pyload-ng:0.5.0b3.dev101-ls256
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/pyload-ng:/config
      - ${DOWNLOADS}:/downloads
    ports:
      - ${WEBUI_PORT}:8000
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: pyload-ng
  revision: 2
  title: pyLoad
  categories: [downloads]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-pyload-ng/
  webui: http://{host}:${WEBUI_PORT}
  description: |
    A download manager with a web interface that fetches files from one-click hosters and other sources, with plugins for many sites.

    The web interface login is pyload with the password pyload until you change it: do that first. Finished downloads go to the download folder you choose, a plain download folder rather than part of a media library. Click'n'Load, which lets a browser extension send links on port 9666, is not published.

    The web interface is served over plain HTTP, so use it on your home network or behind a reverse proxy that serves HTTPS.
  inputs:
    APPDATA:    { kind: path, role: appdata, default: /mnt/cache/appdata }
    DOWNLOADS:
      kind: path
      role: downloads
      default: /mnt/user/data/downloads
      label: Download folder
      description: The folder pyLoad saves finished downloads to.
    WEBUI_PORT: { kind: port, default: 8000, label: Web UI port }
    TZ:         { kind: timezone }
