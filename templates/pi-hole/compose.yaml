# Written from https://docs.pi-hole.net/docker/ and https://docs.pi-hole.net/docker/configuration/ (D19).
# Icon: https://github.com/pi-hole/graphics/blob/master/Vortex/Vortex.svg, MIT (the license of that repository), none. The logo is a Pi-hole trademark (https://pi-hole.net/trademark-rules-and-brand-guidelines/) used here only to identify the application.
#
# Pi-hole's own DHCP server, NTP and HTTPS are not set up: the image
# documentation lists NET_ADMIN, SYS_TIME and port 67 only for those, and says
# NET_ADMIN is safe to skip when DHCP and IPv6 router advertisements are not in
# use, so no capability is added. DNS answers on the DNS port over TCP and UDP;
# clients can only use a port other than 53 where they let you set one.
# Bridge networking needs the DNS listening mode ALL (image documentation), and
# queries then show the Docker gateway as their client. The password of the web
# interface is the WEB_PASSWORD input; the image documentation names it
# FTLCONF_webserver_api_password.
services:
  pihole:
    image: pihole/pihole:2026.09.0
    environment:
      TZ: ${TZ}
      PIHOLE_UID: "99"
      PIHOLE_GID: "100"
      FTLCONF_webserver_api_password: ${WEB_PASSWORD}
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - ${APPDATA}/pi-hole:/etc/pihole
    ports:
      - ${DNS_PORT}:53/tcp
      - ${DNS_PORT}:53/udp
      - ${WEBUI_PORT}:80/tcp
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: pi-hole
  revision: 1
  title: Pi-hole
  categories: [network, dns]
  icon: icon.svg
  docs: https://docs.pi-hole.net/docker/
  webui: http://{host}:${WEBUI_PORT}/admin
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    DNS_PORT:
      kind: port
      default: 53
      label: DNS port
      description: The port Pi-hole answers DNS queries on, over TCP and UDP. Devices and routers use 53 unless they let you choose a port; if another service on this server already uses 53, pick a free port here.
    WEBUI_PORT: { kind: port, default: 80, label: Web UI port }
    WEB_PASSWORD:
      kind: secret
      label: Web interface password
      description: The password for the Pi-hole web interface. Leave it empty to have one generated; it is kept in the stack's .env file.
    TZ: { kind: timezone }
