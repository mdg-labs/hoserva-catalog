# Written from https://docs.linuxserver.io/images/docker-sabnzbd/, https://sabnzbd.org/wiki/, https://sabnzbd.org/wiki/configuration/5.1/folders, https://sabnzbd.org/wiki/extra/hostname-check.html and https://wiki.servarr.com/docker-guide (D19).
# Icon: https://github.com/sabnzbd/sabnzbd/blob/develop/icons/logo-arrow.svg, GPL-2.0-or-later (LICENSE.txt of that repository), none
#
# One mount at /data holds the downloads and the library, so Sonarr, Radarr
# and Lidarr find a finished download at the same path and import it with an
# instant move. The image documentation's /downloads and /incomplete-downloads
# mounts are not used. In the setup wizard or under Config > Folders, set the
# temporary download folder to /data/usenet/incomplete and the completed
# download folder to /data/usenet; categories such as tv, movies and music
# then sort downloads into /data/usenet/tv and so on, the usenet layout of the
# Servarr Docker guide.
#
# SABnzbd only answers to the addresses it knows: open the web UI by the
# server's IP address, or add the server's name to host_whitelist under
# Config > Special, or set a username and password under Config > General
# (SABnzbd wiki, hostname verification).
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls275
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/sabnzbd:/config
      - ${DATA}:/data
    ports:
      - ${WEBUI_PORT}:8080
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: sabnzbd
  revision: 2
  title: SABnzbd
  categories: [downloads]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-sabnzbd/
  webui: http://{host}:${WEBUI_PORT}
  description: |
    A Usenet downloader with a web interface: it fetches the files an NZB describes from your Usenet provider, then checks and unpacks them. Sonarr, Radarr and similar apps can send their downloads to it.

    In the setup wizard or under Config > Folders set the temporary download folder to /data/usenet/incomplete and the completed download folder to /data/usenet, so categories sort downloads into /data/usenet/tv and so on. SABnzbd only answers to addresses it knows: open it by the server's IP address, add the server's name to host_whitelist under Config > Special, or set a username and password under Config > General.
  inputs:
    APPDATA:    { kind: path, role: appdata, default: /mnt/cache/appdata }
    DATA:
      kind: path
      role: share
      default: /mnt/user/data
      label: Data folder
      description: The folder that holds both downloads (usenet) and the media library (media). Use the same folder for every media app so hardlinks and instant moves work.
    WEBUI_PORT: { kind: port, default: 8080, label: Web UI port }
    TZ:         { kind: timezone }
