# Written from https://docs.linuxserver.io/images/docker-smokeping/ and https://oss.oetiker.ch/smokeping/ (D19).
# Icon: https://github.com/selfhst/icons/blob/main/png/smokeping.png, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none. The logo belongs to its project, used here only to identify the application.
#
# SmokePing's web page is at /smokeping/smokeping.cgi on the web UI port.
# To choose what it measures, edit the Targets file in the config folder
# (the appdata folder's smokeping/config) to list the hosts to ping, then wait
# about ten minutes for the first graphs. The image's default Targets file
# holds examples, some of which may not work on your network. After editing,
# restart the app. The latency history (the RRD files and graphs) is kept in
# the data folder, smokeping/data in the appdata folder.
services:
  smokeping:
    image: lscr.io/linuxserver/smokeping:2.9.0-r0-ls185
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/smokeping/config:/config
      - ${APPDATA}/smokeping/data:/data
    ports:
      - ${WEBUI_PORT}:80
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: smokeping
  revision: 1
  title: SmokePing
  categories: [monitoring, network]
  icon: icon.png
  docs: https://docs.linuxserver.io/images/docker-smokeping/
  webui: http://{host}:${WEBUI_PORT}/smokeping/smokeping.cgi
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    WEBUI_PORT: { kind: port, default: 80, label: Web UI port }
    TZ:         { kind: timezone }
