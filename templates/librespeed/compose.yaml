# Written from https://docs.linuxserver.io/images/docker-librespeed/ and https://github.com/librespeed/speedtest/blob/master/doc.md (D19).
# Icon: https://github.com/selfhst/icons/blob/main/svg/librespeed.svg, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none
#
# The speed test page is open to anyone who can reach the port. Its results
# database is at http://<server>:<port>/results/stats.php and asks for the
# password set below. The image requires PASSWORD, so a value is always set:
# leave the input empty and Hoserva generates one, kept in the stack's .env
# file.
#
# Results are stored in a SQLite database in the appdata folder. The image
# documentation also supports MySQL and PostgreSQL results databases
# (DB_TYPE and the DB_* variables), after importing the tables as described
# at https://github.com/librespeed/speedtest/blob/master/doc.md#creating-the-database;
# this template keeps the SQLite default.
#
# The page template is /config/www/index.html in the appdata folder; edit it
# to customise the page, or delete it and restart to get the image default
# back.
services:
  librespeed:
    image: lscr.io/linuxserver/librespeed:v6.3.0-ls293
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
      PASSWORD: ${RESULTS_PASSWORD}
    volumes:
      - ${APPDATA}/librespeed:/config
    ports:
      - ${WEBUI_PORT}:80
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: librespeed
  revision: 3
  title: LibreSpeed
  categories: [network, monitoring]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-librespeed/
  webui: http://{host}:${WEBUI_PORT}
  description: |
    A self-hosted network speed test that runs in the browser: it measures download and upload speed, ping and jitter between a device and your server.

    The test page is open to anyone who can reach the port. The results are kept in the app's folder and shown at /results/stats.php, which asks for the results password. The web interface is served over plain HTTP, so use it on your home network or behind a reverse proxy that serves HTTPS.
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    RESULTS_PASSWORD:
      kind: secret
      label: Results database password
      description: The password for the results page at /results/stats.php. Leave it empty to have one generated; it is kept in the stack's .env file.
    WEBUI_PORT: { kind: port, default: 80, label: Web UI port }
    TZ:         { kind: timezone }
