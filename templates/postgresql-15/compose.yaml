# Written from https://hub.docker.com/_/postgres (the image documentation, https://github.com/docker-library/docs/blob/master/postgres/README.md), https://www.postgresql.org/support/versioning/ (the versioning policy, read from https://raw.githubusercontent.com/postgres/pgweb/master/templates/support/versioning.html) and https://www.postgresql.org/docs/15/release-15.html (the release notes, read from https://raw.githubusercontent.com/postgres/postgres/REL_15_STABLE/doc/src/sgml/release-15.sgml) (D19).
# Icon: https://github.com/selfhst/icons/blob/main/svg/postgresql.svg, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none. The logo is a trademark of the PostgreSQL Community Association, used here only to identify the application.
#
# A standalone PostgreSQL 15 server for apps that need this major version and
# for your own projects. The superuser is postgres with the SUPERUSER_PASSWORD
# input as its password, kept in the stack's .env file; the image applies it
# only when it creates the database on the first start, so change it later in
# PostgreSQL itself. Connect to the server's address on the database port;
# create a separate user and database for each app rather than sharing the
# superuser.
#
# This template only ever moves within PostgreSQL 15. A later major version is
# a separate template, and moving your data to it is the database's own
# upgrade (pg_upgrade, or a dump and restore). The data folder is named after
# this template, so two major versions installed side by side never share
# one; pick a different database port for the second one.
#
# PostgreSQL's versioning policy supports a major version for five years after
# its first release, and 15 was first released in October 2022, so it reaches
# end of life in late 2027. Choose a newer major version for a new install.
#
# The port is mapped because this server's clients are apps in other stacks
# and programs outside Docker, which reach it only through a port on the
# server. Containers in this stack would not need it. Password authentication
# (scram-sha-256) is the image's default for every network connection.
#
# The data is under the appdata folder, never on the pool. Up to PostgreSQL 17
# the image keeps its data in /var/lib/postgresql/data, and the image
# documentation says to mount the data volume there and not at
# /var/lib/postgresql. The image documents no PUID or PGID setting: the files
# are owned by the image's own postgres user. shm_size raises the 64 MB default
# shared memory, which the image documentation says can run out. The
# documentation names no time zone setting, so there is no TZ input.
services:
  postgres:
    image: docker.io/library/postgres:15.19
    environment:
      POSTGRES_PASSWORD: ${SUPERUSER_PASSWORD}
    volumes:
      - ${APPDATA}/postgresql-15:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    shm_size: 128mb
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: postgresql-15
  revision: 2
  title: PostgreSQL 15
  categories: [database, development]
  icon: icon.svg
  docs: https://hub.docker.com/_/postgres
  description: |
    A PostgreSQL relational database server for the apps that need one and for your own projects.

    The PostgreSQL project supports a major version for five years after its first release. PostgreSQL 15 was first released on October 13, 2022, and its final release is scheduled for November 11, 2027. Choose a newer major version for a new install; use this one for apps that need 15 or to keep an existing 15 database running until it is migrated.

    Each major version is its own template, and this one only ever moves within PostgreSQL 15. Moving to a newer major version is PostgreSQL's own upgrade, with pg_upgrade or a dump and restore.
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    SUPERUSER_PASSWORD:
      kind: secret
      label: Superuser password
      description: The password of the postgres superuser. Leave it empty to have one generated; it is kept in the stack's .env file. PostgreSQL applies it only on its first start.
    DB_PORT:
      kind: port
      default: 5432
      label: Database port
      description: The port apps and programs connect to. 5432 is the usual PostgreSQL port; pick another if another PostgreSQL or anything else on this server already uses it.
