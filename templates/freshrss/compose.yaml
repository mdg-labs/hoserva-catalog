# Written from https://docs.linuxserver.io/images/docker-freshrss/ and https://github.com/FreshRSS/FreshRSS/blob/edge/README.md (D19).
# Icon: https://github.com/FreshRSS/FreshRSS/blob/edge/p/themes/icons/favicon.svg, AGPL-3.0 (LICENSE.txt of that repository), none
#
# Open the web UI to run the setup wizard. SQLite, one of the databases
# FreshRSS supports, needs no further container; the wizard also accepts an
# external MySQL, MariaDB or PostgreSQL server. The database and settings
# are kept under the appdata folder.
#
# Extensions are added by putting them in www/freshrss/extensions inside the
# appdata folder; they are active after the container restarts.
services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.30.1-ls324
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/freshrss:/config
    ports:
      - ${WEBUI_PORT}:80
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: freshrss
  revision: 4
  title: FreshRSS
  categories: [productivity]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-freshrss/
  webui: http://{host}:${WEBUI_PORT}
  description: |
    A self-hosted RSS and Atom feed reader that collects the sites you follow in one place, readable from any browser, with support for several users.

    Open the web UI to run the setup wizard. SQLite, one of the databases FreshRSS supports, needs no further container; the wizard also accepts an external MySQL, MariaDB or PostgreSQL server. Extensions go in www/freshrss/extensions in the app's folder and are active after the app restarts. The web interface is served over plain HTTP, so use it on your home network or behind a reverse proxy that serves HTTPS.
  inputs:
    APPDATA:    { kind: path, role: appdata, default: /mnt/cache/appdata }
    WEBUI_PORT: { kind: port, default: 8084, label: Web UI port }
    TZ:         { kind: timezone }
