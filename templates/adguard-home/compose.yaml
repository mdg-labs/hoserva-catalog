# Written from https://adguard-dns.io/kb/adguard-home/docker/ (D19).
# Icon: https://github.com/AdguardTeam/AdGuardHome/blob/master/client_v2/public/assets/favicon.svg, GPL-3.0 (the license of that repository, LICENSE.txt), none. The logo is a trademark of AdGuard, used here only to identify the application.
#
# First start: open the setup port (3000) once and keep the defaults of the
# wizard, DNS on 53 and the admin interface on 80, which are the ports inside
# the container. Once setup is done the interface is on the web port instead.
# The DHCP server (host networking and ports 67 and 68), DNS-over-TLS, -QUIC and
# -HTTPS, and the debug port of the image documentation are not set up. Without
# host networking, queries show the Docker gateway as their client, as the
# image documentation notes.
services:
  adguardhome:
    image: adguard/adguardhome:v0.107.79
    environment:
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/adguard-home/work:/opt/adguardhome/work
      - ${APPDATA}/adguard-home/conf:/opt/adguardhome/conf
    ports:
      - ${DNS_PORT}:53/tcp
      - ${DNS_PORT}:53/udp
      - ${SETUP_PORT}:3000/tcp
      - ${WEBUI_PORT}:80/tcp
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: adguard-home
  revision: 3
  title: AdGuard Home
  categories: [network, dns]
  icon: icon.svg
  docs: https://adguard-dns.io/kb/adguard-home/docker/
  webui: http://{host}:${WEBUI_PORT}
  description: |
    A network-wide DNS server that blocks ads, trackers and malicious domains for every device that uses it as its DNS server, with a web interface for filter lists, custom rules and a query log.

    On the first start, open the first-run setup port once and run the setup wizard, keeping its ports at their defaults (DNS on 53, the admin interface on 80); afterwards the interface is on the Web UI port. Then set this server's address as the DNS server of your router or of single devices. The DHCP server and encrypted DNS (DNS-over-TLS, -QUIC and -HTTPS) are not set up. Without host networking, queries show the Docker gateway as their client instead of the device that sent them.

    The default DNS and Web UI ports, 53 and 80, are also Pi-hole's, so to run both, give one of them different ports.

    The web interface is served over plain HTTP, so use it on your home network or behind a reverse proxy that serves HTTPS.
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    DNS_PORT:
      kind: port
      default: 53
      label: DNS port
      description: The port AdGuard Home answers DNS queries on, over TCP and UDP. Devices and routers use 53 unless they let you choose a port; if another service on this server already uses 53, pick a free port here.
    SETUP_PORT:
      kind: port
      default: 3000
      label: First-run setup port
      description: Open http://this-server:PORT once after installing to run the setup wizard. Keep the wizard's own ports at their defaults. The setup page is only served until setup is finished.
    WEBUI_PORT: { kind: port, default: 80, label: Web UI port }
    TZ: { kind: timezone }
