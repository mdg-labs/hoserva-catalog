# Written from https://docs.linuxserver.io/images/docker-tautulli/, https://github.com/Tautulli/Tautulli/wiki/Installation and https://github.com/Tautulli/Tautulli/wiki/Frequently-Asked-Questions (D19).
# Icon: https://github.com/selfhst/icons/blob/main/svg/tautulli.svg, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none
#
# On the first visit a setup wizard signs in to Plex and asks for the Plex
# server. Plex runs in its own stack (or on another machine), so enter it by
# the server's address and port, for example <server>:32400.
#
# Plex's log folder is not mounted. Tautulli does not need it; it only feeds
# the built-in Plex log viewer (Tautulli FAQ). A mount would point into
# another app's appdata folder, which may not exist when Plex runs elsewhere.
# To use the viewer, add a read-only mount of the Logs folder inside the Plex
# appdata folder, then set the Logs Folder under Settings, Plex Media Server
# (with Show Advanced) to the path it is mounted at.
services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.18.2-ls246
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/tautulli:/config
    ports:
      - ${WEBUI_PORT}:8181
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: tautulli
  revision: 1
  title: Tautulli
  categories: [media, monitoring]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-tautulli/
  webui: http://{host}:${WEBUI_PORT}
  inputs:
    APPDATA:    { kind: path, role: appdata, default: /mnt/cache/appdata }
    WEBUI_PORT: { kind: port, default: 8181, label: Web UI port }
    TZ:         { kind: timezone }
