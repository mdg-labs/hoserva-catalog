# Written from https://docs.linuxserver.io/images/docker-nzbget/, the image's Dockerfile and svc-nzbget run script in https://github.com/linuxserver/docker-nzbget, https://nzbget.com/documentation/nzbget-path-and-folder-structure-guide/, https://nzbget.com/documentation/nzbget-docker-guide-installation-configuration/ and https://wiki.servarr.com/docker-guide (D19).
# Icon: https://github.com/selfhst/icons/blob/main/svg/nzbget.svg, CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/), none
#
# One mount at /data holds the downloads and the library, so Sonarr, Radarr
# and Lidarr find a finished download at the same path and import it with an
# instant move. The image documentation's /downloads mount is not used, so
# under Settings > Paths set DestDir to /data/usenet/completed and InterDir to
# /data/usenet/intermediate (the image presets them under /downloads); in
# Settings > Categories, give tv, movies and music a destination below
# /data/usenet, the usenet layout of the Servarr Docker guide. MainDir stays
# /config, so the queue and the log sit in appdata.
#
# The web UI login is the WEBUI_USER and WEBUI_PASSWORD inputs, which the image
# passes to NZBGet as NZBGET_USER and NZBGET_PASS on every start: they replace
# the default nzbget / tegbzn6789 login, and a username or password changed in
# Settings > Security is overridden again at the next start.
services:
  nzbget:
    image: lscr.io/linuxserver/nzbget:v26.3-ls265
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
      NZBGET_USER: ${WEBUI_USER}
      NZBGET_PASS: ${WEBUI_PASSWORD}
    volumes:
      - ${APPDATA}/nzbget:/config
      - ${DATA}:/data
    ports:
      - ${WEBUI_PORT}:6789
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: nzbget
  revision: 1
  title: NZBGet
  categories: [downloads]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-nzbget/
  webui: http://{host}:${WEBUI_PORT}
  inputs:
    APPDATA:    { kind: path, role: appdata, default: /mnt/cache/appdata }
    DATA:
      kind: path
      role: share
      default: /mnt/user/data
      label: Data folder
      description: The folder that holds both downloads (usenet) and the media library (media). Use the same folder for every media app so hardlinks and instant moves work.
    WEBUI_USER:
      kind: string
      default: nzbget
      label: Web UI username
      description: The username for the NZBGet web interface. Avoid spaces.
    WEBUI_PASSWORD:
      kind: secret
      label: Web UI password
      description: The password for the NZBGet web interface. Leave it empty to have one generated; it is kept in the stack's .env file. Avoid spaces.
    WEBUI_PORT: { kind: port, default: 6789, label: Web UI port }
    TZ:         { kind: timezone }
