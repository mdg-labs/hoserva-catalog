# Written from https://docs.linuxserver.io/images/docker-code-server/, https://github.com/coder/code-server and its guide on exposing code-server, https://github.com/coder/code-server/blob/main/docs/guide.md (D19).
# Icon: https://github.com/coder/code-server/blob/main/src/browser/media/favicon.svg, MIT (the license of that repository), none
#
# code-server is VS Code in the browser. Without a password the image has no
# authentication, so the template always sets one; Hoserva generates it at
# install and keeps it in the stack's .env file. The workspace folder is
# mounted at /workspace and opens by default. To use git with GitHub, put an
# SSH key in the appdata folder under .ssh (/config/.ssh in the container),
# then open a terminal in code-server and set git's user.name and user.email.
#
# The web UI is served over plain HTTP, as the image documentation's
# http://<your-ip>:8443 address shows, so the password and everything you open
# or type, terminal included, cross the network unencrypted. The code-server
# guide says never to expose it directly to the internet without
# authentication and encryption, because someone could take over the machine
# through the terminal. Keep it on your local network, and reach it from
# outside only through an HTTPS reverse proxy or a tunnel such as SSH port
# forwarding, which that guide recommends.
services:
  code-server:
    image: lscr.io/linuxserver/code-server:4.140.0-ls368
    environment:
      PUID: "99"
      PGID: "100"
      TZ: ${TZ}
      PASSWORD: ${PASSWORD}
      DEFAULT_WORKSPACE: /workspace
    volumes:
      - ${APPDATA}/code-server:/config
      - ${WORKSPACE}:/workspace
    ports:
      - ${WEBUI_PORT}:8443
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: code-server
  revision: 2
  title: code-server
  categories: [development]
  icon: icon.svg
  docs: https://docs.linuxserver.io/images/docker-code-server/
  webui: http://{host}:${WEBUI_PORT}
  description: |
    Visual Studio Code in the browser: a full code editor with a terminal, extensions and git, running on your server so you can work on its files and projects from any device with a browser.

    The web interface is served over plain HTTP, so the password and everything you open or type, terminal included, cross the network unencrypted. Keep it on your local network, and reach it from outside only through an HTTPS reverse proxy or an SSH tunnel: whoever signs in gets a terminal that can change the workspace folder.
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    WORKSPACE:
      kind: path
      role: share
      default: /mnt/user/code
      label: Workspace folder
      description: The folder code-server opens, for configuration files and projects. It is mounted at /workspace in code-server.
    PASSWORD:
      kind: secret
      label: Password
      description: The password for the code-server web UI. Leave it empty to have one generated; it is kept in the stack's .env file.
    WEBUI_PORT: { kind: port, default: 8443, label: Web UI port }
    TZ:         { kind: timezone }
