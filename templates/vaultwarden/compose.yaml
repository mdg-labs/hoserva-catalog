# Written from https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose, https://github.com/dani-garcia/vaultwarden/wiki/Enabling-HTTPS, https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page and https://github.com/dani-garcia/vaultwarden/wiki/Configuration-overview (D19).
# Icon: https://github.com/dani-garcia/vaultwarden/blob/main/resources/vaultwarden-icon.svg, AGPL-3.0 (the license of that repository; the file names Mathijs van Veluw as creator and the Rust logo as its relation), none
#
# The web vault uses browser crypto APIs that most browsers make available
# only over HTTPS, so Vaultwarden is meant to sit behind a reverse proxy that
# terminates HTTPS; the port below is the one to point that proxy at. DOMAIN
# is the address that proxy serves, for example https://vault.example.com,
# and Vaultwarden needs it to build correct links and attachment URLs.
#
# SIGNUPS_ALLOWED is true so the first account can be created. Change it to
# "false" after creating your account so that no one else can register.
# ADMIN_TOKEN is not set, so the admin page stays disabled. The documented way
# to protect that token is an Argon2 hash, which this install cannot produce.
# The documentation names no time zone setting, so there is no TZ input.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    environment:
      DOMAIN: ${DOMAIN}
      SIGNUPS_ALLOWED: "true"
    volumes:
      - ${APPDATA}/vaultwarden:/data
    ports:
      - ${WEBUI_PORT}:80
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: vaultwarden
  revision: 2
  title: Vaultwarden
  categories: [security, productivity]
  icon: icon.svg
  docs: https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose
  webui: http://{host}:${WEBUI_PORT}
  inputs:
    APPDATA: { kind: path, role: appdata, default: /mnt/cache/appdata }
    DOMAIN:
      kind: string
      label: Public address
      description: The https address your reverse proxy serves Vaultwarden on, for example https://vault.example.com. Without HTTPS the web vault does not work in most browsers.
    WEBUI_PORT: { kind: port, default: 11001, label: Port for the reverse proxy }
