name: Catalog

# Builds, signs and publishes the signed catalog archive (doc 04 §7, Q65).
#
#   pull request         tooling tests and validation only; no secret is
#                        exposed to a PR.
#   push to dev          the same, then build and sign as a dry run; the
#                        result is a workflow artifact and nothing is
#                        deployed.
#   push to main         the same, then the GitHub Release serial-<serial>,
#                        then the GitHub Pages deploy at catalog.hoserva.dev
#                        and a fetch-back check.
#   workflow_dispatch    like a push to the branch it is run on.
#
# main only moves through the maintainer's dev -> main pull request (Q46),
# so nothing is served before that promotion.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Go version `go run github.com/mdg-labs/hoserva/cmd/hoserva@<pin>`
  # builds the checker with; at least the pinned Hoserva's go.mod directive.
  GO_VERSION: "1.27.1"
  CATALOG_URL: https://catalog.hoserva.dev

jobs:
  tooling-tests:
    name: Tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Shell syntax and shellcheck
        run: |
          scripts=(.ci/*.sh .ci/tests/*.sh .ci/tests/stubs/*)
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck -x -P SCRIPTDIR "${scripts[@]}"
      - name: Tooling tests
        run: .ci/tests/run.sh
      # Keeps the fixtures valid templates, so a bump of .ci/hoserva-version
      # that changes the checker's rules shows up here first.
      - name: Fixtures pass the pinned checker
        run: go run "github.com/mdg-labs/hoserva/cmd/hoserva@$(cat .ci/hoserva-version)" template lint .ci/fixtures/catalog

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check prerequisites
        run: .ci/prereq.sh docker
      - name: Lint, compose config and image existence
        run: .ci/validate.sh .

  build:
    name: Build and sign
    needs: [validate, tooling-tests]
    if: github.event_name != 'pull_request' && github.repository == 'mdg-labs/hoserva-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: catalog-build-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      serial: ${{ steps.verify.outputs.serial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check prerequisites
        run: .ci/prereq.sh
      - name: Build the archive
        run: .ci/build.sh . dist
      # The private key never leaves this job. Logs only match/mismatch;
      # no PEM, hex or `openssl pkey -text` output.
      - name: Verify catalog signing key integrity
        env:
          HOSERVA_CATALOG_SIGNING_KEY: ${{ secrets.HOSERVA_CATALOG_SIGNING_KEY }}
        run: .ci/check-key.sh signing-key.pub.pem
      - name: Sign the archive
        env:
          HOSERVA_CATALOG_SIGNING_KEY: ${{ secrets.HOSERVA_CATALOG_SIGNING_KEY }}
        run: .ci/sign.sh dist/catalog.tar.zst dist/catalog.tar.zst.sig signing-key.pub.pem
      - name: Verify the signed archive
        id: verify
        run: |
          serial="$(.ci/verify.sh dist/catalog.tar.zst dist/catalog.tar.zst.sig signing-key.pub.pem)"
          echo "serial=$serial" >>"$GITHUB_OUTPUT"
          echo "catalog archive serial $serial"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-dist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'mdg-labs/hoserva-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: catalog-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check prerequisites
        run: .ci/prereq.sh gh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalog-dist
          path: dist
      - name: The built archive is the one that was signed
        env:
          SERIAL: ${{ needs.build.outputs.serial }}
        run: |
          serial="$(.ci/verify.sh dist/catalog.tar.zst dist/catalog.tar.zst.sig signing-key.pub.pem)"
          [ "$serial" = "$SERIAL" ] || { echo "the downloaded archive has serial $serial, the build produced $SERIAL" >&2; exit 1; }
      - name: The new serial is higher than the published one
        env:
          SERIAL: ${{ needs.build.outputs.serial }}
        run: .ci/check-serial.sh "$SERIAL" "$CATALOG_URL" signing-key.pub.pem
      - name: This commit is still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/check-tip.sh "$GITHUB_REPOSITORY" main "$GITHUB_SHA"
      - name: Create the release serial-<serial>
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/release.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" dist signing-key.pub.pem

  deploy:
    name: Deploy
    needs: [build, release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'mdg-labs/hoserva-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: catalog-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check prerequisites
        run: .ci/prereq.sh gh
      - name: The new serial is higher than the published one
        env:
          SERIAL: ${{ needs.build.outputs.serial }}
        run: .ci/check-serial.sh "$SERIAL" "$CATALOG_URL" signing-key.pub.pem
      - name: This commit is still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/check-tip.sh "$GITHUB_REPOSITORY" main "$GITHUB_SHA"
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Fetch back the published archive
        env:
          SERIAL: ${{ needs.build.outputs.serial }}
        run: .ci/check-published.sh "$CATALOG_URL" "$SERIAL" signing-key.pub.pem
