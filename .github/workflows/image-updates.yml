name: Image updates

# Compares the image every template pins with what its registry publishes and
# keeps one open `image-update` issue per outdated template (CONTRIBUTING.md,
# "Image updates"). It never changes a template: writing the update stays a
# human or agent change made from upstream documentation.
#
# It checks the templates on dev, where template changes land (Q46), so an
# update already made there is not reported again while it waits for the
# promotion to main. A schedule only runs the workflow file on the default
# branch, so nothing runs daily until a dev -> main promotion carries this file.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: image-updates
  cancel-in-progress: false

jobs:
  image-updates:
    name: Check image versions
    if: github.repository == 'mdg-labs/hoserva-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - name: Open, update and close image-update issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .ci/image-updates.py templates
